name: builder-contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    # القالب فقط — ريبوهات المالكين تتبع القالب عبر المزامنة
    if: github.repository == 'Nfarahat99/assistant-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Nfarahat99/assistant-builder
          path: .builder
      - name: assistant-builder contract
        run: TEMPLATE_DIR=. node --import tsx --test .builder/tests/contract/template-contract.mjs
